name: CD - Build, Scan, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ vars.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.IMAGE_NAME }}:latest
          load: true

      - name: Escaneo de vulnerabilidades
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ vars.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Desplegar en EC2 por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE="${{ vars.IMAGE_NAME }}:latest"

            echo "Pull de la nueva imagen"
            docker pull "$IMAGE"

            echo "Eliminando contenedor de validacion previo si existe"
            docker rm -f mi-app-new || true

            echo "Levantando contenedor candidato en puerto 3001"
            docker run -d \
              --name mi-app-new \
              --restart unless-stopped \
              -p 3001:3000 \
              "$IMAGE"

            echo "Esperando inicializacion"
            sleep 8

            echo "Health check del nuevo contenedor"
            if curl -sf http://localhost:3001/health; then
              echo "Health check exitoso"

              echo "Deteniendo contenedor actual si existe"
              docker stop mi-app || true
              docker rm mi-app || true

              echo "Publicando nueva version en puerto 80"
              docker run -d \
                --name mi-app \
                --restart unless-stopped \
                -p 80:3000 \
                "$IMAGE"

              echo "Limpiando contenedor temporal"
              docker rm -f mi-app-new || true
            else
              echo "Health check fallido. Se mantiene version anterior"
              docker logs mi-app-new || true
              docker rm -f mi-app-new || true
              exit 1
            fi

            docker system prune -f
